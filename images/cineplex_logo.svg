  <path d="M 50 16 A 34 34 0 0 1 84 50 A 34 34 0 0 1 50 84 A 34 34 0 0 1 16 50 A 34 34 0 0 1 50 16 Z" fill="none" stroke="url(#cpx-gold)" stroke-width="4" stroke-dasharray="8 4" opacity="0.8"/>
  <!-- Central Stylized C & Starburst -->
  <path d="M 64 34 C 58 26 42 26 34 34 C 24 44 24 56 34 66 C 42 74 58 74 64 66 C 66 64 68 60 68 56 L 52 56 C 50 58 48 60 45 60 C 39 60 36 55 36 50 C 36 45 39 40 45 40 C 48 40 50 42 52 44 L 68 44 C 68 40 66 36 64 34 Z" fill="url(#cpx-gold)" filter="url(#cpx-glow)"/>
  <!-- Gold Center Sparkle -->
  <polygon points="58,50 63,48 68,50 63,52" fill="#FFFFFF"/>
  <polygon points="63,45 65,50 63,55 61,50" fill="#FFFFFF"/>
</svg>
