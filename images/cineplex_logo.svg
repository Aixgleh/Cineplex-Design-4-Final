<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="36" height="36" fill="none">
  <defs>
    <linearGradient id="cpx-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#E5A800"/>
    </linearGradient>
    <linearGradient id="cpx-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0074D9"/>
      <stop offset="100%" stop-color="#002855"/>
    </linearGradient>
    <filter id="cpx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFCC00" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#001833" stroke="url(#cpx-gold)" stroke-width="3"/>
